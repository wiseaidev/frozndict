[package]
name = "frozndict"
version = "2.0.0"
authors = ["Mahmoud Harmouch <oss@wiseai.dev>"]
edition = "2024"
description = "🧊 A memory-efficient, fully immutable dictionary for Python, powered by Rust."
license = "MIT"
homepage = "https://github.com/wiseaidotdev/frozndict"
documentation = "https://docs.rs/frozndict"
repository = "https://github.com/wiseaidotdev/frozndict"
keywords = ["frozendict", "immutable", "dictionary", "python", "hashmap"]
categories = [
    "data-structures",
    "api-bindings",
    "memory-management",
]
exclude = [
    "/tests",
    ".*",
    "/python",
    "/assets",
    "pyproject.toml",
    "README.rst",
    "HISTORY.rst",
    "CONTRIBUTING.rst",
]

[lib]
name = "frozndict"
crate-type = ["cdylib", "rlib"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module"], optional = true }
ahash = "0.8.12"

[features]
default = []
python = ["pyo3"]

[profile.release]
opt-level = 3
debug = false
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[badges]
maintenance = { status = "actively-developed" }
