version: 2.1

orbs:
  rust: circleci/rust@1.6.0

executors:
  rust_python:
    docker:
      - image: cimg/python:3.12
    resource_class: medium

jobs:
  test:
    executor: rust_python
    steps:
      - checkout

      - rust/install:
          version: stable

      - run:
          name: Install maturin and pytest
          command: pip install maturin pytest

      - run:
          name: Build and Install extension
          command: |
            maturin build --features python --out dist
            pip install --find-links dist frozndict

      - run:
          name: Run Python test suite
          command: pytest tests/ -v --tb=short

      - run:
          name: Run Rust tests
          command: cargo test --all-features

  lint:
    executor: rust_python
    steps:
      - checkout

      - rust/install:
          version: stable

      - run:
          name: Install components
          command: rustup component add clippy rustfmt

      - run:
          name: Check Rust formatting
          command: cargo fmt --all -- --check

      - run:
          name: Run Clippy
          command: cargo clippy --features python --tests -- -D warnings

workflows:
  ci:
    jobs:
      - test:
          filters:
            branches:
              only: /.*/
      - lint:
          filters:
            branches:
              only: /.*/
